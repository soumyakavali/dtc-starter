networks:
  biotill-net:
    driver: bridge

services:
  # =========================================================================
  # 1. PostgreSQL Database (Medusa v2 Relational Store)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: biotill-postgres
    restart: unless-stopped
    networks:
      - biotill-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medusa-biotill}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-biotill"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # =========================================================================
  # 2. Redis Cache & Event Bus
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: biotill-redis
    restart: unless-stopped
    networks:
      - biotill-net
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 3. Medusa v2 Backend (BIOTILL AGRI PRIVATE LIMITED API & Admin)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: biotill-backend
    restart: unless-stopped
    networks:
      - biotill-net
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa-biotill}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-biotill_super_secure_jwt_secret_key_2026}
      COOKIE_SECRET: ${COOKIE_SECRET:-biotill_super_secure_cookie_secret_key_2026}
      STORE_CORS: http://localhost:3000,http://127.0.0.1:3000
      ADMIN_CORS: http://localhost:9000,http://localhost:7001,http://localhost:5173
      AUTH_CORS: http://localhost:3000,http://localhost:9000,http://127.0.0.1:3000
      PORT: 9000
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 4. Next.js 15 Storefront (BIOTILL AGRI Direct eCommerce Frontend)
  # =========================================================================
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    container_name: biotill-storefront
    restart: unless-stopped
    networks:
      - biotill-net
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      MEDUSA_BACKEND_URL: http://backend:9000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_01J_dummy_biotill_key}
      NEXT_PUBLIC_DEFAULT_REGION: in
      NODE_ENV: development
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
